<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HP 33120A Web Control</title>
  <style>
    :root {
      --bg-dim: #121318;
      --bg-card: #1e2029;
      --bg-input: #282a36;
      --border: #383a4c;
      --primary: #4f46e5;
      --primary-hover: #6366f1;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8f8f2;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dim);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      background: var(--bg-card);
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--danger);
    }

    .status-dot.connected {
      background-color: var(--success);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button.btn-disconnect {
      background-color: var(--danger);
    }

    .card {
      background: var(--bg-card);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Waveform Selector */
    .wave-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .wave-btn {
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      flex-direction: column;
      padding: 12px;
      font-size: 0.85rem;
    }

    .wave-btn.active {
      border-color: var(--primary);
      background-color: rgba(79, 70, 229, 0.2);
    }

    .wave-icon {
      width: 28px;
      height: 28px;
      stroke: currentColor;
    }

    /* Parameter Controls */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input, select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Presets Grid */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .preset-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      justify-content: flex-start;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .preset-btn:hover {
      border-color: var(--primary);
    }

    /* Terminal Console */
    .terminal {
      background-color: #0d0e11;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-tx { color: #60a5fa; }
    .log-rx { color: #34d399; }
    .log-err { color: #f87171; }
    .log-info { color: #9ca3af; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header & Connection -->
  <header>
    <div>
      <h1>HP 33120A Control</h1>
      <div class="status-badge">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Nicht verbunden</span>
      </div>
    </div>
    <button id="connectBtn" onclick="toggleConnect()">Verbinden</button>
  </header>

  <!-- Manual Waveform & Parameter Controls -->
  <section class="card">
    <h2>Signalform & Parameter</h2>

    <div class="wave-grid">
      <button class="wave-btn active" onclick="setWaveform('SIN')" id="wave-SIN">
        <svg class="wave-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M 2 12 C 5 4, 7 4, 10 12 C 13 20, 15 20, 18 12 C 19.5 8, 20.5 8, 22 12" /></svg>
        Sinus
      </button>
      <button class="wave-btn" onclick="setWaveform('SQU')" id="wave-SQU">
        <svg class="wave-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M 3 17 V 7 H 9 V 17 H 15 V 7 H 21 V 17" /></svg>
        Rechteck
      </button>
      <button class="wave-btn" onclick="setWaveform('TRI')" id="wave-TRI">
        <svg class="wave-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M 3 17 L 7.5 7 L 12 17 L 16.5 7 L 21 17" /></svg>
        Dreieck
      </button>
      <button class="wave-btn" onclick="setWaveform('RAMP')" id="wave-RAMP">
        <svg class="wave-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M 3 17 L 11 7 V 17 L 19 7 V 17" /></svg>
        Sägezahn
      </button>
      <button class="wave-btn" onclick="setWaveform('NOIS')" id="wave-NOIS">
        <svg class="wave-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M 3 12 L 5 7 L 7 16 L 9 8 L 11 15 L 13 6 L 15 17 L 17 9 L 19 14 L 21 12" /></svg>
        Rauschen
      </button>
      <button class="wave-btn" onclick="setWaveform('DC')" id="wave-DC">
        <svg class="wave-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M 3 9 H 21" /><path d="M 3 15 H 7 M 10 15 H 14 M 17 15 H 21" /></svg>
        DC
      </button>
    </div>

    <div class="controls-grid">
      <div class="form-group">
        <label for="freqInput">Frequenz</label>
        <div class="input-group">
          <input type="number" id="freqInput" value="1000" step="any" min="0.0001">
          <select id="freqUnit" style="width: 90px;">
            <option value="1">Hz</option>
            <option value="1000" selected>kHz</option>
            <option value="1000000">MHz</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="ampInput">Amplitude (Vpp)</label>
        <input type="number" id="ampInput" value="1.0" step="0.1" min="0.05" max="10">
      </div>

      <div class="form-group">
        <label for="offsetInput">Offset (V)</label>
        <input type="number" id="offsetInput" value="0.0" step="0.1" min="-5" max="5">
      </div>
    </div>

    <button onclick="applyManualSettings()" style="width: 100%; justify-content: center;">
      Parameter Anwenden
    </button>
  </section>

  <!-- Presets -->
  <section class="card">
    <h2>Presets</h2>
    <div class="preset-grid">
      <button class="preset-btn" onclick="applyPreset('SIN', 1000, 1.0, 0)">
        <svg class="wave-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M 2 12 C 5 4, 7 4, 10 12 C 13 20, 15 20, 18 12 C 19.5 8, 20.5 8, 22 12" /></svg>
        <span>1 kHz Sinus 1Vpp</span>
      </button>

      <button class="preset-btn" onclick="applyPreset('SQU', 10000, 3.3, 1.65)">
        <svg class="wave-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M 3 17 V 7 H 9 V 17 H 15 V 7 H 21 V 17" /></svg>
        <span>10 kHz Rechteck 3.3V</span>
      </button>

      <button class="preset-btn" onclick="applyPreset('TRI', 500, 2.0, 0)">
        <svg class="wave-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M 3 17 L 7.5 7 L 12 17 L 16.5 7 L 21 17" /></svg>
        <span>500 Hz Dreieck 2Vpp</span>
      </button>

      <button class="preset-btn" onclick="applyPreset('DC', 0, 0, 2.5)">
        <svg class="wave-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M 3 9 H 21" /><path d="M 3 15 H 7 M 10 15 H 14 M 17 15 H 21" /></svg>
        <span>2.5 V DC Offset</span>
      </button>
    </div>
  </section>

  <!-- Terminal / Log Output -->
  <section class="card">
    <h2>Serieller Monitor (SCPI Log)</h2>
    <div class="terminal" id="terminal"></div>
  </section>
</div>

<script>
  let port = null;
  let writer = null;
  let reader = null;
  let keepReading = false;
  let selectedWave = 'SIN';

  // SCPI Generator Commands Mapping
  const SCPI_WAVE_MAP = {
    'SIN': 'SIN',
    'SQU': 'SQU',
    'TRI': 'TRI',
    'RAMP': 'RAMP',
    'NOIS': 'NOIS',
    'DC': 'DC'
  };

  // Helper for Logging
  function log(text, type = 'info') {
    const term = document.getElementById('terminal');
    const line = document.createElement('div');
    line.className = `log-${type}`;
    const time = new Date().toLocaleTimeString();
    line.textContent = `[${time}] ${text}`;
    term.appendChild(line);
    term.scrollTop = term.scrollHeight;
  }

  // Check Web Serial API support
  if (!("serial" in navigator)) {
    alert("Web Serial API wird von diesem Browser nicht unterstützt. Bitte nutze Google Chrome, Microsoft Edge oder Opera.");
  }

  // Serial Connect / Disconnect
  async function toggleConnect() {
    if (port) {
      await disconnect();
    } else {
      await connect();
    }
  }

  async function connect() {
    try {
      port = await navigator.serial.requestPort();
      // HP 33120A Default RS-232 Settings: 9600 Baud, 8 Data Bits, 2 Stop Bits (or 1)
      await port.open({ baudRate: 9600, stopBits: 2 });

      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('statusText').textContent = "Verbunden";
      document.getElementById('connectBtn').textContent = "Trennen";
      document.getElementById('connectBtn').classList.add('btn-disconnect');

      log("Serielle Verbindung hergestellt (9600 Baud).", "info");

      // TextEncoder setup
      const textEncoder = new TextEncoderStream();
      textEncoder.readable.pipeTo(port.writable);
      writer = textEncoder.writable.getWriter();

      // Read Loop
      keepReading = true;
      readLoop();

      // Send Identification Query
      await sendSCPI("*IDN?");

    } catch (err) {
      log("Fehler beim Verbinden: " + err.message, "err");
      await disconnect();
    }
  }

  async function disconnect() {
    keepReading = false;
    if (reader) {
      try { await reader.cancel(); } catch (e) {}
    }
    if (writer) {
      try { await writer.close(); } catch (e) {}
    }
    if (port) {
      try { await port.close(); } catch (e) {}
    }

    port = null;
    writer = null;
    reader = null;

    document.getElementById('statusDot').classList.remove('connected');
    document.getElementById('statusText').textContent = "Nicht verbunden";
    document.getElementById('connectBtn').textContent = "Verbinden";
    document.getElementById('connectBtn').classList.remove('btn-disconnect');

    log("Verbindung getrennt.", "info");
  }

  async function readLoop() {
    while (port && port.readable && keepReading) {
      const textDecoder = new TextDecoderStream();
      const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
      reader = textDecoder.readable.getReader();

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) {
            log("RX: " + value.trim(), "rx");
          }
        }
      } catch (err) {
        log("Lesefehler: " + err.message, "err");
      } finally {
        reader.releaseLock();
      }
    }
  }

  // Send SCPI Command
  async function sendSCPI(cmd) {
    if (!writer) {
      log("Fehler: Nicht verbunden! Befehl ignoriert: " + cmd, "err");
      return;
    }
    try {
      log("TX: " + cmd, "tx");
      // HP 33120A expects commands terminated with \r\n or \n
      await writer.write(cmd + "\r\n");
    } catch (err) {
      log("Sendefehler: " + err.message, "err");
    }
  }

  // UI Waveform Handler
  function setWaveform(type) {
    selectedWave = type;
    document.querySelectorAll('.wave-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`wave-${type}`).classList.add('active');
  }

  // Apply Manual Controls
  async function applyManualSettings() {
    const rawFreq = parseFloat(document.getElementById('freqInput').value);
    const unitMult = parseFloat(document.getElementById('freqUnit').value);
    const freqHz = rawFreq * unitMult;

    const amp = parseFloat(document.getElementById('ampInput').value);
    const offset = parseFloat(document.getElementById('offsetInput').value);

    await sendSCPI(`FUNC ${SCPI_WAVE_MAP[selectedWave]}`);

    if (selectedWave !== 'DC') {
      await sendSCPI(`FREQ ${freqHz}`);
      await sendSCPI(`VOLT ${amp}`);
    }
    await sendSCPI(`VOLT:OFFS ${offset}`);
  }

  // Apply Presets
  async function applyPreset(wave, freqHz, ampV, offsetV) {
    setWaveform(wave);

    // Update UI Controls
    if (freqHz >= 1000000) {
      document.getElementById('freqInput').value = freqHz / 1000000;
      document.getElementById('freqUnit').value = "1000000";
    } else if (freqHz >= 1000) {
      document.getElementById('freqInput').value = freqHz / 1000;
      document.getElementById('freqUnit').value = "1000";
    } else {
      document.getElementById('freqInput').value = freqHz;
      document.getElementById('freqUnit').value = "1";
    }

    document.getElementById('ampInput').value = ampV;
    document.getElementById('offsetInput').value = offsetV;

    // Send Commands
    await applyManualSettings();
  }
</script>

</body>
</html>
